# Apps the car serves in a browser (racecar_neo_ros2_driver/apps.py).
#
# The 8080 home page shows one tile per entry, in this order. The driving-app
# rules (map_control.py, safe_shutdown.py), setup_dashboards.sh and
# `racecar service` read the same list, so a new app is one entry here plus
# its unit. Starting and stopping from 8080 also needs the unit in
# scripts/polkit/49-racecar-dashboards.rules (test/test_apps.py checks it).
#
# Keys:
#   id          short name; `racecar service start <id>` and the unit name
#   name, icon, desc
#               tile label, icon in scripts/web/icons.svg, hover tip
#   port        where the app serves its page
#   path        its name on the car's web server: http://<car>/<path>/ (port 80
#               forwards to the port; setup_web.sh writes the nginx site)
#   prefixed    the app itself serves under /<path>/ on its port too
#               (JupyterLab's base_url); the others serve at / on their port
#   group       the 8080 row: core, tools, or autonomy. Core apps run at boot
#               and stay open while setup is unfinished; Tools and Autonomy
#               wait for setup. Clear apps stops every app whose unit is not
#               started at boot (units.CORE).
#   unit        systemd unit without .service; leave it out for a tile that
#               opens nothing
#   exclusive   publishes /drive: one runs at a time, and mapping or
#               localization stops it
#   startable   8080 may start it (polkit grants start and stop)
#   needs       a feature it needs on (camera)
#   dir, script lab dashboards only: folder under scripts/dashboards/ and the
#               script the rendered unit runs (setup_dashboards.sh)

home:
  port: 8080
  path: home
  unit: racecar-dashboard

apps:
  - id: profile
    name: Car Profile
    icon: car
    port: 8088
    path: profile
    group: core
    unit: racecar-profile
    exclusive: false
    startable: false
    desc: View details about the car

  - id: jupyter
    name: JupyterLab
    icon: notebook
    port: 8888
    path: jupyter
    prefixed: true
    group: core
    unit: racecar-jupyter
    exclusive: false
    startable: false
    desc: Notebooks and code

  - id: files
    name: Files
    icon: folder
    port: 8089
    path: files
    group: core
    unit: racecar-files
    exclusive: false
    startable: false
    desc: Browse the car's pages and files

  - id: terminal
    name: Terminal
    icon: terminal
    port: 8086
    path: terminal
    group: tools
    unit: racecar-terminal
    exclusive: false
    startable: true
    desc: Command line on the car

  - id: browser
    name: Browser
    icon: globe
    port: 8087
    path: browser
    group: tools
    unit: racecar-browser
    exclusive: false
    startable: true
    desc: Web browser on the car

  - id: webteleop
    name: Web Teleop
    icon: gamepad
    port: 8081
    path: webteleop
    group: tools
    unit: racecar-webteleop
    exclusive: true
    startable: true
    desc: Drive from the browser with camera and lidar
    dir: teleop_dashboard
    script: teleop.py

  - id: linefollow
    name: Line Follow
    icon: line
    port: 8082
    path: linefollow
    group: tools
    unit: racecar-linefollow
    exclusive: true
    startable: true
    desc: Follow a colored line with the camera
    needs: camera
    dir: linefollow_dashboard
    script: linefollow.py

  - id: wallfollow
    name: Wall Follow
    icon: wall
    port: 8083
    path: wallfollow
    group: tools
    unit: racecar-wallfollow
    exclusive: true
    startable: true
    desc: Follow walls with the lidar
    dir: wallfollow_dashboard
    script: wallfollow.py

  - id: camlabel
    name: Camera Label
    icon: tag
    port: 8085
    path: camlabel
    group: tools
    unit: racecar-camlabel
    exclusive: false
    startable: true
    desc: Capture camera frames and label them for training
    needs: camera
    dir: camlabel_dashboard
    script: camlabel.py

  - id: mapview
    name: Mapper
    icon: map
    port: 8084
    path: mapper
    group: autonomy
    unit: racecar-mapview
    exclusive: false
    startable: false
    desc: Build and load maps

  - id: planner
    name: Planner
    icon: navigate
    port: 8090
    path: planner
    group: autonomy
    unit: racecar-planner
    exclusive: true
    startable: true
    desc: Drive the car to a point on a map
