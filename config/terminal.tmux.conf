# tmux settings for the terminal app's terminals (scripts/terminal.py), on the
# separate socket `racecar-terminal`. The user's own tmux is not affected.
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g mouse on
set -g escape-time 10
# The status line carries the low-battery line (scripts/battery_alert.py).
set -g status on
set -g status-style "bg=#505166,fg=#ffffff"
set -g status-left " #S "
set -g status-left-length 24
set -g status-right ""
# A terminal open on two devices takes the size of the one typing last; the
# other device shows blank space instead of tmux's dots.
set -gw fill-character " "
