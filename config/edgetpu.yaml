edgetpu_node:
  ros__parameters:
    # Paths are resolved against the package share dir if relative.
    # Compile new .tflite models with `edgetpu_compiler` (x86 only) before use.
    # EfficientDet-Lite0 320x320, post-training quantized and EdgeTPU
    # compiled, trained on COCO: 90 classes, from google-coral/test_data.
    # Alt: models/efficientdet_lite0_generic_edgetpu.tflite + labels.txt (car only).
    model_path: "models/efficientdet_lite0_320_coco_edgetpu.tflite"
    labels_path: "models/coco_labels.txt"

    # Minimum confidence (0..1) to keep a detection; the Coral examples' default.
    score_threshold: 0.4

    # Cap detections per frame; 0 = no limit.
    max_detections: 0

    # RealSense color stream.
    image_topic: "/camera/color"

    # Inference cap (Hz), independent of the 60 fps camera. 0 = every frame.
    # See docs/troubleshooting.md, "EdgeTPU inference rate and threshold".
    inference_rate_hz: 15.0

    # Heartbeat + stale-input watchdog.
    diagnostics_period_sec: 1.0
    image_timeout_sec: 5.0
