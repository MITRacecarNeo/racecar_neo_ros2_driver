# foxglove_bridge, started by autonomy.launch.py with foxglove:=true (the
# autonomy unit's AUTONOMY_FOXGLOVE=1). View-only for Lichtblick or Foxglove:
# the map, scan, frames, and poses; camera streams are left out because they
# can saturate the car's 2.4 GHz access point. The one topic a client may
# publish is /initialpose (a pose estimate tool); /drive is never accepted.
# Per-car overrides: foxglove.local.yaml.
foxglove_bridge:
  ros__parameters:
    port: 8765
    topic_whitelist:
      - '^/map$'
      - '^/map_metadata$'
      - '^/scan$'
      - '^/tf$'
      - '^/tf_static$'
      - '^/robot_description$'
      - '^/odom$'
      - '^/odom/integrated$'
      - '^/amcl_pose$'
      - '^/particle_cloud$'
      - '^/autonomy/.*'
    capabilities: [clientPublish]
    client_topic_whitelist: ['^/initialpose$']
    service_whitelist: ['^$']
    param_whitelist: ['^$']
