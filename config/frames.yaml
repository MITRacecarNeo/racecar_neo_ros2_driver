# Frame offsets for urdf/racecar_neo.urdf.xacro, read by launch/frames.launch.py.
#
# Fleet base values. Per-car differences go in frames.local.yaml (gitignored),
# whose keys win; calibrate_lidar.py writes laser_yaw_deg there.
#
# Units are in each key name: millimetres and degrees, converted to metres and
# radians at launch. Positions are in base_link: the floor point under the
# rear axle midpoint, x forward, y left, z up (REP-103). Angles follow the
# same axes: roll about x, pitch about y (positive tips the front down), yaw
# about z (positive turns left).
#
# Sources, from the car measurement sheet (2026-10-04 pull): "C.L" is a
# measurement on the reference car, "model" is the current model value
# pending measurement. Sheet row numbers in brackets.

# Lidar (RPLIDAR): rotation axis and scan plane.
laser_x_mm: 238.3        # model [6]
laser_y_mm: 0.0          # model [7]
laser_z_mm: 195.0        # C.L [8]; model 201.6
laser_roll_deg: 0.0      # C.L [10]
laser_pitch_deg: 0.0     # C.L [10]
laser_yaw_deg: 180.0     # C.L [9]: motor end toward the rear, scan zero faces aft

# IMU: LSM9DS1 breakout centre. The rotation is the convention, not a
# measurement: config/pit.yaml remaps the LSM9DS1 into the RealSense IMU's
# optical axes (x right, y down, z forward), and this rotation labels them.
imu_x_mm: 190.0          # model [11]
imu_y_mm: 0.0            # model [11]
imu_z_mm: 113.5          # model [11]
imu_roll_deg: -90.0
imu_pitch_deg: 0.0
imu_yaw_deg: -90.0

# RealSense D435i case. camera_link is derived from these in the URDF, using
# the case geometry from realsense2_description.
camera_front_x_mm: 277.9      # model [13]: front aluminium face
camera_y_mm: 0.0              # model [14]: case centre
camera_bottom_z_mm: 107.0     # model [15]: underside of the case
camera_roll_deg: 0.0
camera_pitch_deg: 0.0         # model [16]
camera_yaw_deg: 0.0

# Footprint, for the URDF visual and later costmaps.
footprint_front_x_mm: 287.5   # model [17]
footprint_rear_x_mm: -59.7    # model [18]
footprint_left_y_mm: 104.5    # model [19]
footprint_right_y_mm: -107.0  # model [19]
ride_height_mm: 20.5          # model [34]
