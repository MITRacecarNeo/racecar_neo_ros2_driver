# AMCL localization on a saved map, started by autonomy.launch.py with
# mode:=localization (localizer:=amcl, the default), which sets the map file and
# the start pose. Per-car overrides: amcl.local.yaml.
amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    map_topic: /map
    tf_broadcast: true
    transform_tolerance: 1.0

    # An Ackermann car has no sideways motion, so the differential model fits.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Odometry noise: rotation from rotation, rotation from translation,
    # translation from translation, translation from rotation, strafe (omni only).
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: likelihood_field
    max_beams: 60
    laser_min_range: 0.3              # self-returns inside 0.3 m
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    # Beam skipping drops beams most particles disagree on: people or objects
    # passing through.
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.15
    update_min_a: 0.15
    save_pose_rate: 0.5

    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: [map_server, amcl]
