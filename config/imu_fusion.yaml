imu_fusion_node:
  ros__parameters:
    # With both fresh, accel + gyro are averaged; a single fresh source passes
    # through.
    sources: ["/imu/realsense", "/imu/lsm9ds1"]
    # Source that realsense_cal.yaml's biases apply to.
    realsense_topic: "/imu/realsense"
    output_topic: "/imu/fused"
    publish_rate_hz: 100.0
    source_timeout_sec: 0.25
    frame_id: imu_link
