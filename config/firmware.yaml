# Firmware a car runs with this driver release; `racecar setup car` checks it.
#
# teensy:    the NEO-PIT board firmware (/pit/firmware fw.version).
# realsense: the D435i camera firmware (the camera node logs it at start), and
#            the library and camera packages it was tested with.

teensy:
  version: '0.9.2'
  tag: v0.9.2

realsense:
  version: '5.17.0.9'
  file: D4XX_FW_Image-5.17.0.9.bin
  library: '2.58.4'   # ros-jazzy-librealsense2
  camera: '4.58.4'    # ros-jazzy-realsense2-camera
