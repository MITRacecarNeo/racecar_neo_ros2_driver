battery_guard:
  ros__parameters:
    # Gens ace 5000 mAh 2S LiPo. Charge usable down to 3.5 V per cell under
    # the car's load; the rated 5000 includes charge below that. The guard
    # also measures the battery in the car during the run and moves toward
    # that value (learn_* below).
    capacity_mah: 4700.0

    # Cells in series. 0 reads the count from the first voltage (3.3 to
    # 4.35 V per cell).
    cells: 0

    # Charge left (%) against battery voltage under load (mV), highest first,
    # for a battery of curve_cells cells; other counts scale it per cell.
    # Measured on full discharges; the PIT firmware's LED bar uses the same
    # table. Both lists must keep the same length.
    curve_cells: 2
    curve_mv: [8400, 8200, 8110, 8050, 7860, 7740, 7620, 7545,
               7485, 7450, 7395, 7305, 7280, 7195, 7000]
    curve_pct: [100, 100, 95, 90, 80, 70, 60, 50,
                40, 30, 20, 10, 5, 2, 0]

    # Added to the voltage as amps times this before the curve. 0 because the
    # curve is already under load.
    r_internal_ohm: 0.0

    # Power and mean current average over window_sec; charge uses the median
    # voltage over soc_window_sec. No estimate until min_samples are in the
    # window, and no time left while the mean current is under min_current_a.
    window_sec: 300.0
    soc_window_sec: 60.0
    min_samples: 30
    min_current_a: 0.1

    # Readings older than stale_sec, or outside the plausible range per cell,
    # never warn or shut down.
    stale_sec: 5.0
    plausible_min_cell_volts: 3.0
    plausible_max_cell_volts: 4.3

    # The shutdown countdown starts at this voltage per cell whatever the
    # estimate says (3.55: 7.1 V on 2S). Time left counts down to it. Set
    # above the curve's empty point to leave room for the drop while driving.
    floor_cell_volts: 3.55

    # Capacity measured during the run: from a drop of learn_min_drop_pct on
    # the curve, moving fully to the measured value by learn_full_drop_pct,
    # within learn_min_ratio to learn_max_ratio of capacity_mah.
    learn_min_drop_pct: 20.0
    learn_full_drop_pct: 40.0
    learn_min_ratio: 0.5
    learn_max_ratio: 1.2

    # Minutes left that start the warning and the shutdown countdown.
    warn_min: 15.0
    shutdown_min: 5.0

    # false: the shutdown_min estimate only warns; the floor still shuts down.
    shutdown_enabled: false
