# LSM9DS1 accelerometer and gyroscope bias, consumed by pit_node via
# pit.launch.py. Regenerate per car with:
#   ros2 run racecar_neo_ros2_driver calibrate_imu.py
#
# Zeros below are the uncalibrated defaults; pit_node declares the same values,
# so an uncalibrated car behaves identically with or without this file.
pit_node:
  ros__parameters:
    accelerometer.bias: [0.0, 0.0, 0.0]
    gyroscope.bias: [0.0, 0.0, 0.0]
