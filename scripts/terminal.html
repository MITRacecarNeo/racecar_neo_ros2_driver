<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RACECAR Neo terminal</title>
<link rel="stylesheet" href="/ui/rcn.css?v=13">
<script src="/ui/battery.js?v=13" defer></script>
<link rel="icon" href="/ui/brand/app-icon-32.png">
<link rel="apple-touch-icon" href="/ui/brand/app-icon-180.png">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: var(--rcn-space-2); }
  .pane { flex: 1; min-height: 0; border: 1px solid var(--rcn-steel); border-radius: var(--rcn-radius-md); overflow: hidden; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
</style>
</head>
<body>
<header class="rcn-header">
  <img class="rcn-mark" src="/ui/brand/mark.png" alt="RACECAR Neo">
  <span class="rcn-title">Terminal</span>
  <span class="rcn-spacer"></span>
  <form method="post" action="/logout"><button class="rcn-btn quiet small" type="submit">Log out</button></form>
</header>
<main>
  <div class="pane"><iframe src="/pane/main/" title="Terminal pane"></iframe></div>
</main>
</body>
</html>
