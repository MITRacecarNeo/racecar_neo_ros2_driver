# throttle_node for validation mapping sessions (slam_session.py map): speed
# scaled to at most 0.02 of full scale, which the firmware drives at its floor
# (0.5 m/s setpoint). The trigger moves the car only past about half travel
# (below 0.01 is neutral). The car's throttle.local.yaml still loads after this.
throttle_node:
  ros__parameters:
    max_speed_forward: 0.02
    max_speed_backward: 0.02
    max_steering: 1.0
    steering_trim: 0.0
