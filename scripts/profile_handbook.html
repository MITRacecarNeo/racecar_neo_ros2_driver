<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RACECAR Neo handbook</title>
<link rel="stylesheet" href="ui/rcn.css?v={{asset}}">
<script src="ui/ui.js?v={{asset}}"></script>
<script src="ui/profile_nav.js?v={{asset}}"></script>
<script src="ui/battery.js?v={{asset}}" defer></script>
<script src="ui/stall.js?v={{asset}}" defer></script>
<link rel="icon" href="ui/brand/app-icon-32.png">
<link rel="apple-touch-icon" href="ui/brand/app-icon-180.png">
<style>
main { overflow-x: hidden; }
main > .rcn-override { margin: var(--rcn-space-3) var(--rcn-space-3) 0; }
article { max-width: 860px; margin: 0 auto; padding: var(--rcn-space-4); }
article h1 { font: 700 28px/36px var(--rcn-font-display); margin: var(--rcn-space-2) 0 var(--rcn-space-4); }
article h2 { font-size: 22px; line-height: 30px; margin: var(--rcn-space-8) 0 var(--rcn-space-2); }
article h3 { font: 600 18px/26px var(--rcn-font-sans); margin: var(--rcn-space-6) 0 var(--rcn-space-2); }
article h4 { font: 600 16px/24px var(--rcn-font-sans); margin: var(--rcn-space-4) 0 var(--rcn-space-1); }
article p, article li { line-height: 1.55; }
article ul, article ol { padding-left: var(--rcn-space-6); }
article li { margin: var(--rcn-space-1) 0; }
article a { color: var(--rcn-link); }
article table { border-collapse: collapse; display: block; overflow-x: auto; margin: var(--rcn-space-3) 0; }
article th, article td { border: 1px solid var(--rcn-border); padding: 6px 10px; text-align: left; vertical-align: top; }
article th { background: var(--rcn-surface); }
article code { font-family: var(--rcn-font-mono); font-size: 0.92em; background: var(--rcn-code-bg); padding: 1px 4px; border-radius: var(--rcn-radius-sm); }
article pre { background: var(--rcn-code-bg); color: var(--rcn-code-text); padding: var(--rcn-space-3); border-radius: var(--rcn-radius-md); overflow-x: auto; }
article pre code { background: none; padding: 0; }
article img { max-width: 100%; }
article :target { scroll-margin-top: var(--rcn-space-4); }
</style>
</head>
<body>
<header class="rcn-header">
  <img class="rcn-mark" src="ui/brand/mark.png" alt="RACECAR Neo">
  <span class="rcn-title">Handbook</span>
  <span class="rcn-spacer"></span>
</header>
<main><article id="page"></article></main>
<script>
'use strict';
const name = decodeURIComponent(location.pathname.split('/handbook/').pop()) || 'index';
RcnProfileNav.mount('handbook', name);
fetch(`api/handbook/${encodeURIComponent(name)}`).then((r) => r.json()).then((page) => {
  document.title = `${page.title} - RACECAR Neo handbook`;
  // Rendered on the car from docs/handbook/ (scripts/handbook.py), text escaped there.
  document.getElementById('page').innerHTML = page.html;
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}).catch(() => { document.getElementById('page').textContent = 'This page did not load.'; });
</script>
</body>
</html>
