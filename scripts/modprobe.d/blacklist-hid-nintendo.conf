# Blacklist hid_nintendo so the kernel doesn't bind it to the EasySMX KC-8236
# gamepad (and similar third-party controllers that spoof the Switch Pro
# VID:PID 057e:2009).
#
# hid_nintendo (kernel >= 5.16) claims 057e:2009 as a Switch controller: wrong
# button mapping, no /dev/input/js0. Without it, the controller times out
# into Xbox 360 mode (2f24:016d, bound by `xpad`) and joy_node works.
#
# The blacklist is module-wide, so genuine Switch Pro controllers are
# unsupported. Installed by scripts/setup_udev.sh. Why not per-device
# unbinding: docs/troubleshooting.md, "Gamepad hid_nintendo blacklist".
blacklist hid_nintendo
