<!DOCTYPE html>
<html lang="en" data-app="Wall follow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall follow - RACECAR Neo</title>
<link rel="stylesheet" href="/ui/rcn.css?v={{asset}}">
<script src="/ui/battery.js?v={{asset}}" defer></script>
<link rel="icon" href="/ui/brand/app-icon-32.png">
<script src="/ui/lost.js?v={{asset}}" defer></script>
<script src="/ui/override.js?v={{asset}}" defer></script>
<script src="/ui/charts.js?v={{asset}}"></script>
<script src="/ui/ui.js?v={{asset}}"></script>
<script src="/ui/api.js?v={{asset}}"></script>
<script src="/ui/tune.js?v={{asset}}"></script>
<script src="/ui/logs.js?v={{asset}}"></script>
<script src="/ui/lidar.js?v={{asset}}"></script>
<style>
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--rcn-space-4); }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  #chart { height: 300px; }
</style>
</head>
<body>
<header class="rcn-header">
  <img class="rcn-mark" src="/ui/brand/mark.png" alt="RACECAR Neo">
  <div class="rcn-heading">
    <span class="rcn-title">Wall follow</span>
    <span class="rcn-meta">mode <b id="mode">-</b> &middot; error <b id="err">-</b> &middot; steer <b id="steer">-</b> &middot; throttle <b id="thr">-</b> &middot; encoder <b id="enc">-</b> m/s</span>
  </div>
  <span class="rcn-spacer"></span>
  <button class="rcn-btn quiet small" onclick="reset()" title="Reload saved settings">Reset</button>
  <button class="rcn-btn danger small" onclick="stopCar()" title="Set speed to 0">Stop</button>
</header>

<main class="rcn-main">
<div class="grid">
  <div class="rcn-section">
    <h2>Lidar</h2>
    <div class="rcn-zoombox">
      <canvas id="lidar" class="rcn-canvas" width="560" height="560"></canvas>
      <div class="rcn-zoom">
        <button class="rcn-btn quiet" onclick="lidar.zoom(1 / 1.25)" aria-label="Zoom in"><svg class="rcn-icon"><use href="/ui/icons.svg#plus"/></svg></button>
        <button class="rcn-btn quiet" onclick="lidar.zoom(1.25)" aria-label="Zoom out"><svg class="rcn-icon"><use href="/ui/icons.svg#minus"/></svg></button>
      </div>
    </div>
    <div class="rcn-caption">Range <span id="lidarRange">4.0</span> m</div>
  </div>

  <div class="rcn-section">
    <h2>Error</h2>
    <div class="rcn-chart" id="chart"></div>
    <div class="rcn-legend" id="chartLegend"></div>
  </div>

  <div class="rcn-section">
    <h2>Tune</h2>
    <div id="form"></div>
    <div class="rcn-tools">
      <button class="rcn-btn primary small" onclick="saveTune()">Save</button>
      <button class="rcn-btn quiet small" onclick="loadTune()">Load</button>
    </div>
    <div class="rcn-readout" id="detail"></div>
  </div>
</div>

<div class="rcn-section" id="logs"><h2>Logs</h2></div>
</main>

<script>
'use strict';
const { $, setHtml, token } = RcnUi;
const { post } = RcnApi;
const { timeChart, legendHtml, recentTicks } = RcnCharts;
const COMMON = [
  { key: 'speed', label: 'speed (0 to 1, times max_mps)', tip: 'Throttle cap, 0 to 1', min: 0, max: 1, step: 0.01 },
  { key: 'kp', tip: 'Steering per meter of error', min: 0, max: 3, step: 0.01 },
  { key: 'kd', tip: 'Steering damper. Raise it if the car wobbles', min: 0, max: 10, step: 0.1 },
  { key: 'speed_kp', tip: 'Throttle drop per m/s of error. 0: constant speed', min: 0, max: 1, step: 0.01 },
  { key: 'speed_kd', tip: 'Damper on the speed correction', min: 0, max: 1, step: 0.01 },
  { key: 'window', tip: 'Averaging window per ray, degrees', min: 1, max: 30, step: 1 },
  { key: 'lookahead', tip: 'Distances are capped here, meters', min: 0.5, max: 6, step: 0.1 },
];
const SLIDERS = {
  static: [...COMMON, { key: 'look_angle', tip: 'Side windows this many degrees off the nose', min: 10, max: 90, step: 1 }],
  dynamic: [...COMMON,
    { key: 'width', tip: 'Search this many degrees either side of the nose', min: 10, max: 120, step: 1 },
    { key: 'side_weight', tip: 'Bias toward the right, m per degree. Negative prefers left', min: -0.02, max: 0.02, step: 0.001 }],
};
const form = RcnTune.sliders($('form'), SLIDERS.static);
let mode = 'static';

function saveTune() { post('/save').then(() => RcnUi.toast('Saved.')); }
function loadTune() { post('/load').then(() => RcnUi.toast('Loaded.')); }
function reset() { post('/load'); }
function stopCar() { post('/params', { speed: 0 }); }

// ---- lidar: the scan, plus the windows or arc the controller reads ----
const lidar = RcnLidar.view($('lidar'), $('lidarRange'));
function drawLidar(scan, ov) {
  lidar.draw(scan, ({ range, ray }) => {
    const L = ov.la ? Math.min(ov.la, range) : range;
    const gray = 'rgba(227, 227, 235, 0.45)', accent = token('--rcn-orange');
    if (ov.mode === 'static') {
      for (const s of [1, -1]) {
        ray(s * ov.look_angle - ov.window / 2, L, gray, 1);
        ray(s * ov.look_angle + ov.window / 2, L, gray, 1);
        ray(s * ov.look_angle, Math.min(s > 0 ? ov.right : ov.left, range), accent, 3);
      }
    } else if (ov.mode === 'dynamic') {
      ray(-ov.width, L, gray, 1);
      ray(ov.width, L, gray, 1);
      ray(ov.target_deg, L, accent, 3);
    }
  });
}

RcnApi.poll('/state', 120, (d) => {
  mode = (d.params.mode == 1 || d.params.mode === 'dynamic') ? 'dynamic' : 'static';
  const ov = d.overlay || {};
  $('mode').textContent = mode;
  $('err').textContent = ov.error ?? '-';
  $('steer').textContent = ov.steer ?? '-';
  $('thr').textContent = ov.speed_cmd ?? '-';
  $('enc').textContent = d.enc_speed;
  form.use(SLIDERS[mode]);
  form.sync(d.params);
  $('detail').textContent = mode === 'static'
    ? `left ${ov.left ?? '-'} m  right ${ov.right ?? '-'} m`
    : `target ${ov.target_deg ?? '-'} deg`;
  drawLidar(d.scan, ov);
  $('lidar').title = mode === 'static' ? 'Orange: measured distances. Gray: averaging windows' : 'Orange: target heading. Gray: search arc';
  // Static error is meters, shown in cm; dynamic error is -1 to 1.
  const cm = mode === 'static', hist = d.hist || [];
  const now = hist.length ? hist[hist.length - 1][0] : 0;
  timeChart($('chart'), now - 30, now,
    [{ name: 'Error', style: 'a', axis: 'l', unit: cm ? 'cm' : '', digits: cm ? 0 : 2, minSpan: cm ? 5 : 0.1,
       pts: hist.map((r) => [r[0], cm ? r[1] * 100 : r[1]]) }],
    recentTicks(now, 10), { gapSec: 0.5, marks: d.marks });
  setHtml('chartLegend', legendHtml([{ name: cm ? 'Error (cm): right minus left, setpoint 0' : 'Error (-1 to 1), setpoint 0', style: 'a' }]));
});

RcnLogs.mount($('logs'), (rows, marks, name) => ({
  info: `${name}: ${rows.length} rows, ${marks.length} changes`,
  series: [
    { name: 'Error', style: 'a', axis: 'l', unit: '', digits: 3, minSpan: 0.1, pts: rows.map((r) => [r[0], r[1]]) },
    { name: 'Encoder', style: 'b', axis: 'r', unit: 'm/s', digits: 2, minSpan: 0.2, pts: rows.map((r) => [r[0], r[4]]) },
  ],
  legend: [{ name: 'Error (left)', style: 'a' }, { name: 'Encoder (m/s, right)', style: 'b' }],
}));
</script>
</body>
</html>
