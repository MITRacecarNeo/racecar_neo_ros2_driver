# RACECAR Neo web teleop parameters: how hard the drive buttons push.
# Save on the dashboard writes this file; Reset or Load re-reads it.

speed: 0.0          # 0..1 throttle while forward or back is held. Ships at
                    # 0.0: raise deliberately; the mux gates but the
                    # transmitter SWB switch is the gate), so the buttons do
                    # nothing until you raise it.
angle: 1.0          # 0..1 steering while left or right is held; 1 = full lock

cmd_timeout: 0.5    # seconds without a command from the browser before the
                    # service drives zero. Covers a closed tab, a dropped
                    # link, or a key stuck down in a page that lost focus.

# Which camera topic to read. Latest driver: /camera/color. Older cars: /camera.
camera_topic: /camera/color

# The D435i depth stream, shown under the color frame. Leave it empty on a
# car whose camera is color only; the card then shows the color frame alone.
depth_topic: /camera/depth

depth_max_m: 4.0      # far end of the depth ramp, metres. Anything past this
                      # clamps to the dark end instead of dropping out. 4 m
                      # suits a lab floor; raise it for a corridor.

# vision_msgs/Detection2DArray for the Detections toggle on the colour view.
# edgetpu_node publishes /edgetpu/inference; a car that remaps the detector
# elsewhere points this at it. Leave empty on a car with no detector: the
# toggle then reports itself unavailable instead of waiting forever.
detections_topic: /edgetpu/inference

preview_width: 320    # live view width sent to the browser, pixels
preview_quality: 45   # live view jpeg quality 1..100
