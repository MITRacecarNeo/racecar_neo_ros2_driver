<!DOCTYPE html>
<html lang="en" data-app="Line follow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line follow - RACECAR Neo</title>
<link rel="stylesheet" href="/ui/rcn.css?v=11">
<link rel="icon" href="/ui/brand/app-icon-32.png">
<script src="/ui/lost.js?v=11" defer></script>
<script src="/ui/override.js?v=11" defer></script>
<script src="/ui/charts.js?v=11"></script>
<style>
  .rcn-header .heading { display: flex; flex-direction: column; min-width: 0; }
  .rcn-header .meta { font: 600 13px/18px var(--rcn-font-sans); color: var(--rcn-text-muted); }
  .rcn-header .meta b { color: var(--rcn-text); font-variant-numeric: tabular-nums; }
  main { max-width: 1500px; margin: 0 auto; padding: var(--rcn-space-4); display: grid; gap: var(--rcn-space-4); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--rcn-space-4); }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--rcn-surface); border-radius: var(--rcn-radius-md); padding: var(--rcn-space-4); min-width: 0; }
  .card h2 { font-size: 20px; line-height: 28px; margin-bottom: var(--rcn-space-3); }
  .card h3 { font: 600 16px/24px var(--rcn-font-sans); margin: 0 0 var(--rcn-space-2); }
  .view { background: var(--rcn-code-bg); border-radius: var(--rcn-radius-sm); width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: contain; }
  .caption { font: 600 13px/18px var(--rcn-font-sans); color: var(--rcn-text-muted); margin-top: var(--rcn-space-2); }
  .state { font: 700 22px/28px var(--rcn-font-display); text-align: center; border-radius: var(--rcn-radius-md); padding: var(--rcn-space-4) var(--rcn-space-2); background: var(--rcn-bg); }
  .state.lost { background: var(--rcn-crimson); color: var(--rcn-paper); }
  .rcn-chart { height: 170px; margin-top: var(--rcn-space-3); }
  .rcn-legend { margin-top: var(--rcn-space-2); }
  .tunecols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--rcn-space-4) var(--rcn-space-6); }
  @media (max-width: 1100px) { .tunecols { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .tunecols { grid-template-columns: 1fr; } }
  label.slider { display: block; margin-top: var(--rcn-space-3); color: var(--rcn-text-muted); font-weight: 600; }
  label.slider b { color: var(--rcn-text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  input[type=number].rcn-input { width: 6rem; margin-left: var(--rcn-space-2); padding: 4px 8px; }
  .tools { display: flex; flex-wrap: wrap; gap: var(--rcn-space-2); align-items: center; margin-top: var(--rcn-space-4); }
  select.rcn-input { max-width: 220px; }
  /* A two-thumb range: two sliders on one track. Their tracks ignore the
     pointer, so only the thumbs catch it; the fill between them sits under. */
  .dual { position: relative; height: 28px; margin-top: var(--rcn-space-1); }
  .dual .track { position: absolute; left: 0; right: 0; top: 11px; height: 6px; border-radius: 3px; background: var(--rcn-steel); }
  .dual .track.hue { background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
  .dual .fill { position: absolute; top: 11px; height: 6px; background: var(--rcn-orange); border-radius: 3px; pointer-events: none; }
  .dual .track.hue + .fill { background: rgba(35, 31, 32, 0.45); border: 1px solid var(--rcn-paper); top: 10px; height: 8px; }
  .dual input[type=range] { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 28px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none; }
  .dual input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 28px; }
  .dual input[type=range]::-moz-range-track { background: transparent; height: 28px; }
  .dual input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; pointer-events: auto; width: 16px; height: 16px; margin-top: 6px; border-radius: 50%; background: var(--rcn-paper); border: 2px solid var(--rcn-orange); cursor: pointer; }
  .dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: var(--rcn-paper); border: 2px solid var(--rcn-orange); cursor: pointer; }
</style>
</head>
<body>
<header class="rcn-header">
  <img class="rcn-mark" src="/ui/brand/mark.png" alt="RACECAR Neo">
  <div class="heading">
    <span class="rcn-title">Line follow</span>
    <span class="meta">line <b id="mode">-</b> &middot; offset <b id="err">-</b> &middot; steer <b id="steer">-</b> &middot; throttle <b id="thr">-</b> &middot; encoder <b id="enc">-</b> m/s &middot; camera <b id="fps">-</b> fps &middot; processed <b id="pfps">-</b> fps &middot; frame <b id="res">-</b></span>
  </div>
  <span class="rcn-spacer"></span>
  <button class="rcn-btn quiet small" onclick="reset()" title="Reload saved settings.">Reset</button>
  <button class="rcn-btn danger small" onclick="stopCar()" title="Set speed to 0.">Stop</button>
</header>

<main>
<div class="grid">
  <div class="card">
    <h2>Camera</h2>
    <img id="color" class="view" alt="Camera" title="Gold: crop area. Red: largest contour. Gray: setpoint.">
  </div>
  <div class="card">
    <h2>Mask</h2>
    <img id="mask" class="view" alt="Mask" title="White: inside the HSV threshold.">
  </div>
  <div class="card">
    <h2>State</h2>
    <div class="state" id="state">-</div>
    <div class="rcn-chart" id="chart" title="Offset from the setpoint. -1: left edge. +1: right edge."></div>
    <div class="rcn-legend" id="chartLegend"></div>
  </div>
</div>

<div class="card">
  <h2>Tune</h2>
  <div class="tunecols">
    <div>
      <h3 title="Drag both thumbs of each bar.">1. HSV threshold</h3>
      <div id="hsvform"></div>
    </div>
    <div>
      <h3 title="Throttle and proportional steering gain.">2. Speed and angle</h3>
      <div id="driveform"></div>
    </div>
    <div>
      <h3 title="Crop area edges, from the top of the frame.">3. Crop area</h3>
      <div id="cropform"></div>
      <label class="slider" title="Smallest contour that counts, in pixels.">min_area
        <input id="in_min_area" class="rcn-input" type="number" step="1" min="1" onchange="post('/params', {min_area: parseInt(this.value)})"></label>
    </div>
    <div>
      <h3 title="Proportional speed gain and derivative steering gain.">4. Proportional speed and derivative angle</h3>
      <div id="pdform"></div>
    </div>
  </div>
  <div class="tools">
    <button class="rcn-btn primary small" onclick="post('/save')">Save</button>
    <button class="rcn-btn quiet small" onclick="reset()">Load</button>
  </div>
</div>

<div class="card">
  <h2>Logs</h2>
  <div class="tools" style="margin-top: 0">
    <button class="rcn-btn quiet small" onclick="saveLog()">Save log</button>
    <select class="rcn-input" id="logsel" aria-label="Log file"></select>
    <button class="rcn-btn quiet small" onclick="loadLog()">Load log</button>
    <span class="caption" id="loginfo" style="margin-top: 0"></span>
  </div>
  <div class="rcn-chart" id="logChart" style="height: 200px"></div>
  <div class="rcn-legend" id="logLegend"></div>
</div>
</main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const { timeChart, legendHtml, recentTicks, niceTicks } = RcnCharts;
// Single-thumb sliders, in the order each group shows them.
const SLIDERS = {
  driveform: [
    { key: 'speed', tip: 'Throttle, 0 to 1.', min: 0, max: 1, step: 0.01 },
    { key: 'angle_kp', tip: 'Proportional steering gain.', min: 0, max: 4, step: 0.01 },
  ],
  cropform: [
    { key: 'crop_top', tip: 'Top edge, 0 to 1.', min: 0, max: 1, step: 0.01 },
    { key: 'crop_bottom', tip: 'Bottom edge, 0 to 1.', min: 0, max: 1, step: 0.01 },
  ],
  pdform: [
    { key: 'speed_kp', tip: 'Proportional speed gain. 0: constant speed.', min: 0, max: 1, step: 0.01 },
    { key: 'angle_kd', tip: 'Derivative steering gain. Raise it if the car weaves.', min: 0, max: 2, step: 0.01 },
  ],
};
// Two-thumb bars: one per color channel.
const DUALS = [
  { lo: 'h_low', hi: 'h_high', label: 'hue', tip: '0 to 179. Low above high wraps, for red.', max: 179, cls: 'hue' },
  { lo: 's_low', hi: 's_high', label: 'saturation', tip: '0 to 255.', max: 255, cls: '' },
  { lo: 'v_low', hi: 'v_high', label: 'value', tip: '0 to 255.', max: 255, cls: '' },
];

function post(path, body) {
  return fetch(path, { method: 'POST', body: body ? JSON.stringify(body) : null });
}

// A slider fires on every pixel of a drag: send at most one update per
// SEND_MS, always the newest value.
const SEND_MS = 60;
let pending = {}, sendTimer = null;
function queue(key, value) {
  pending[key] = value;
  if (sendTimer) return;
  sendTimer = setTimeout(() => { const body = pending; pending = {}; sendTimer = null; post('/params', body); }, SEND_MS);
}
function reset() { post('/load').then(() => { $('hsvform').dataset.built = ''; }); }
function stopCar() { post('/params', { speed: 0 }).then(() => { $('hsvform').dataset.built = ''; }); }
function showVal(key, v) { const el = $(`val_${key}`); if (el) el.textContent = v; }

function setFill(d) {
  const lo = parseInt($(`in_${d.lo}`).value), hi = parseInt($(`in_${d.hi}`).value);
  const fill = $(`fill_${d.lo}`);
  if (lo <= hi) {
    fill.style.left = `${lo / d.max * 100}%`;
    fill.style.width = `${(hi - lo) / d.max * 100}%`;
    fill.style.background = '';
  } else {
    // Wrapped: fill outside the two thumbs.
    fill.style.left = '0%'; fill.style.width = '100%';
    fill.style.background = `linear-gradient(to right, currentColor ${hi / d.max * 100}%, transparent ${hi / d.max * 100}%, transparent ${lo / d.max * 100}%, currentColor ${lo / d.max * 100}%)`;
  }
  $(`val_${d.lo}`).textContent = `${lo} to ${hi}${lo > hi ? ' (wraps)' : ''}`;
}

function buildForm(p) {
  // Rebuild only on Reset, Load and Stop, so polling never interrupts a drag.
  const anchor = $('hsvform');
  if (anchor.dataset.built) return;
  anchor.dataset.built = '1';
  anchor.innerHTML = DUALS.map((d) => `
    <label class="slider" title="${d.tip}">${d.label} <b id="val_${d.lo}"></b></label>
    <div class="dual" title="${d.tip}">
      <div class="track ${d.cls}"></div>
      <div class="fill" id="fill_${d.lo}" style="color: var(--rcn-orange)"></div>
      <input id="in_${d.lo}" type="range" min="0" max="${d.max}" step="1" value="${p[d.lo]}" aria-label="${d.label} low">
      <input id="in_${d.hi}" type="range" min="0" max="${d.max}" step="1" value="${p[d.hi]}" aria-label="${d.label} high">
    </div>`).join('');
  for (const d of DUALS) {
    for (const k of [d.lo, d.hi]) $(`in_${k}`).oninput = (e) => { setFill(d); queue(k, parseInt(e.target.value)); };
    setFill(d);
  }
  for (const [form, list] of Object.entries(SLIDERS)) {
    $(form).innerHTML = list.map((s) => `
      <label class="slider" title="${s.tip}">${s.key} <b id="val_${s.key}">${p[s.key]}</b>
        <input id="in_${s.key}" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${p[s.key]}"></label>`).join('');
    for (const s of list) $(`in_${s.key}`).oninput = (e) => { showVal(s.key, e.target.value); queue(s.key, parseFloat(e.target.value)); };
  }
  $('in_min_area').value = p.min_area;
}

// The service clamps what it is sent, so after a drag the thumbs move to
// what applied; a thumb being held is left alone.
function syncForm(p) {
  if (document.querySelector('input:active')) return;
  for (const list of Object.values(SLIDERS)) {
    for (const s of list) {
      const el = $(`in_${s.key}`);
      if (el && parseFloat(el.value) !== p[s.key]) { el.value = p[s.key]; showVal(s.key, p[s.key]); }
    }
  }
  for (const d of DUALS) {
    let moved = false;
    for (const k of [d.lo, d.hi]) {
      const el = $(`in_${k}`);
      if (el && parseInt(el.value) !== p[k]) { el.value = p[k]; moved = true; }
    }
    if (moved) setFill(d);
  }
}

// One frame in flight per view; pauses while the tab is hidden.
function liveLoop(id, path, period) {
  const img = $(id);
  (function tick() {
    if (document.hidden) { setTimeout(tick, 250); return; }
    const t = Date.now();
    const done = () => {
      img.removeEventListener('load', done); img.removeEventListener('error', done);
      setTimeout(tick, Math.max(20, period - (Date.now() - t)));
    };
    img.addEventListener('load', done); img.addEventListener('error', done);
    img.src = `${path}?${t}`;
  })();
}
liveLoop('color', '/frame/color', 120);
liveLoop('mask', '/frame/mask', 120);

const shown = new Map();
function setLegend(id, html) { if (shown.get(id) !== html) { shown.set(id, html); $(id).innerHTML = html; } }
const LOST = '<span><svg viewBox="0 0 22 8"><rect x="1" y="1" width="20" height="6" fill="var(--rcn-led-red)"/></svg>Line lost</span>';

let busy = false;
function update() {
  if (busy) return;
  busy = true;
  fetch('/state').then((r) => r.json()).then((d) => {
    busy = false;
    $('mode').textContent = d.found ? 'found' : 'lost';
    $('err').textContent = d.error;
    $('steer').textContent = d.steer;
    $('thr').textContent = d.speed_cmd;
    $('enc').textContent = d.enc_speed;
    $('fps').textContent = d.cam_fps;
    $('pfps').textContent = d.proc_fps;
    $('res').textContent = d.res[0] ? `${d.res[0]}x${d.res[1]} -> ${d.proc_res[0]}x${d.proc_res[1]}` : 'none';

    const box = $('state');
    box.textContent = d.found ? 'LINE FOUND' : 'LINE LOST';
    box.className = 'state' + (d.found ? '' : ' lost');
    box.title = d.found
      ? `Contour center: column ${d.cx}, row ${d.cy}. Area: ${d.area} px.`
      : `No contour for ${d.lost_for === null ? 'the whole run' : d.lost_for + ' s'}. Holding the last command.`;

    buildForm(d.params);
    syncForm(d.params);
    const hist = d.hist || [];
    const now = hist.length ? hist[hist.length - 1][0] : 0;
    // The offset is already -1 to 1, so the axis is fixed: a small wobble looks small.
    timeChart($('chart'), now - 30, now,
      [{ name: 'Offset', style: 'a', axis: 'l', unit: '', digits: 2, pts: hist.map((r) => [r[0], r[1]]) }],
      recentTicks(now, 10), { gapSec: 0.5, fixed: { l: [-1, 1] }, marks: d.marks, bands: hist.map((r) => [r[0], r[2]]) });
    setLegend('chartLegend', legendHtml([{ name: 'Offset vs setpoint 0 (-1 left edge, +1 right edge)', style: 'a' }]) + LOST);
  }).catch(() => { busy = false; });
}

// ---- logs ----
const logTicks = (t0) => Object.assign((a, b) => {
  const step = niceTicks(0, b - a, 5)[1] || 1, out = [];
  for (let s = 0; s <= b - a + 1e-6; s += step) out.push([a + s, `${(a + s - t0).toFixed(0)} s`]);
  return out;
}, { label: (t) => `${(t - t0).toFixed(1)} s` });
function loadLog() {
  const f = $('logsel').value;
  if (!f) return;
  fetch('/logs/' + f).then((r) => r.text()).then((txt) => {
    const lines = txt.trim().split('\n');
    const marks = lines.filter((l) => l.startsWith('# mark')).map((l) => { const p = l.split(','); return [parseFloat(p[1]), p.slice(2).join(',')]; });
    const rows = lines.filter((l) => !l.startsWith('#')).slice(1).map((l) => l.split(',').map(Number));
    const lostRows = rows.filter((r) => r[5]).length;
    $('loginfo').textContent = `${f}: ${rows.length} frames, ${marks.length} changes, ${lostRows} with the line lost`;
    if (!rows.length) return;
    const t0 = rows[0][0], t1 = rows[rows.length - 1][0];
    timeChart($('logChart'), t0, t1, [
      { name: 'Offset', style: 'a', axis: 'l', unit: '', digits: 2, pts: rows.map((r) => [r[0], r[1]]) },
      { name: 'Steer', style: 'b', axis: 'l', unit: '', digits: 2, pts: rows.map((r) => [r[0], r[2]]) },
    ], logTicks(t0), { gapSec: 0.5, fixed: { l: [-1, 1] }, marks, bands: rows.map((r) => [r[0], r[5]]) });
    setLegend('logLegend', legendHtml([{ name: 'Offset', style: 'a' }, { name: 'Steer', style: 'b' }]) + LOST);
  });
}
function saveLog() { post('/logs/save').then(() => refreshLogs(true)); }
function refreshLogs(loadLatest) {
  fetch('/logs').then((r) => r.json()).then((names) => {
    const sel = $('logsel');
    sel.innerHTML = names.map((n) => `<option>${n}</option>`).join('');
    sel.selectedIndex = names.length - 1;
    if (loadLatest && names.length) loadLog();
  });
}
refreshLogs(false);

update();
setInterval(update, 120);
</script>
</body>
</html>
