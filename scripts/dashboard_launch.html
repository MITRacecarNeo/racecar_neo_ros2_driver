<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RACECAR Neo</title>
<link rel="stylesheet" href="/ui/rcn.css?v=12">
<script src="/ui/battery.js?v=12" defer></script>
<link rel="icon" href="/ui/brand/app-icon-32.png">
<style>
  main { max-width: 420px; margin: 0 auto; padding: 15vh var(--rcn-space-4) var(--rcn-space-8); text-align: center; }
  .glyph { width: 76px; height: 76px; margin: 0 auto var(--rcn-space-4); border-radius: 20px; background: var(--rcn-surface); display: grid; place-items: center; color: var(--rcn-orange); border: 3px solid var(--rcn-gold); }
  .glyph .rcn-icon { width: 36px; height: 36px; }
  .bar { height: 8px; border-radius: var(--rcn-radius-pill); background: var(--rcn-surface); overflow: hidden; margin: var(--rcn-space-6) 0 var(--rcn-space-3); }
  .bar > div { height: 100%; width: 0; background: var(--rcn-accent); transition: width 0.4s ease-out; }
  #note { min-height: 26px; }
  .acts { display: flex; gap: var(--rcn-space-2); justify-content: center; margin-top: var(--rcn-space-4); }
</style>
</head>
<body>
<header class="rcn-header">
  <img class="rcn-mark" src="/ui/brand/mark.png" alt="RACECAR Neo">
</header>
<main>
  <div class="glyph" id="glyph"></div>
  <h2 id="title">Opening...</h2>
  <div class="bar" role="progressbar" aria-label="Loading"><div id="fill"></div></div>
  <div class="rcn-small rcn-muted" id="note"></div>
  <div class="acts">
    <a class="rcn-btn quiet small" id="cancel" href="/">Cancel</a>
  </div>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('app') || '';
const LIMIT_MS = 60000;
const POLL_MS = 500;

const FILL_MS = 400;
function fillTo(pct) {
  $('fill').style.width = `${pct}%`;
  return new Promise((res) => setTimeout(res, FILL_MS + 100));
}
let cancelled = false;
function fail(text) {
  $('title').textContent = 'Could not open';
  $('note').textContent = text;
}
// Close this tab; the apps page is still open in the tab that opened it. A
// tab the page did not open cannot close itself, so it goes to the apps page.
$('cancel').onclick = (e) => {
  e.preventDefault();
  cancelled = true;
  window.close();
  setTimeout(() => location.replace('/'), 300);
};

async function launch() {
  $('note').textContent = '';
  $('fill').style.width = '0';
  let app = null;
  try {
    app = ((await (await fetch('/api/status')).json()).apps || []).find((a) => a.id === id);
  } catch (err) { /* reported below */ }
  if (!app) { fail('Unknown app.'); return; }
  document.title = `${app.name} - RACECAR Neo`;
  $('glyph').innerHTML = `<svg class="rcn-icon"><use href="/ui/icons.svg#${app.icon}"/></svg>`;
  $('title').textContent = `Opening ${app.name}...`;
  try {
    const r = await (await fetch('/api/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ app: id }),
    })).json();
    if (!r.ok) { fail(r.message); return; }
  } catch (err) { fail('Lost contact with the car.'); return; }

  const t0 = Date.now();
  for (;;) {
    const elapsed = Date.now() - t0;
    // Most apps answer within 5 to 15 s; the bar slows toward the end rather than stopping.
    $('fill').style.width = `${Math.round(95 * (1 - Math.exp(-elapsed / 6000)))}%`;
    try {
      const s = await (await fetch(`/api/ready?app=${encodeURIComponent(id)}`)).json();
      if (cancelled) return;
      if (s.ready) {
        // Let the bar reach the end before the app replaces this page.
        await fillTo(100);
        location.replace(`${location.protocol}//${location.hostname}:${s.port}/`);
        return;
      }
    } catch (err) { /* keep trying until the limit */ }
    if (elapsed > LIMIT_MS) { fail(`${app.name} did not start.`); return; }
    await new Promise((res) => setTimeout(res, POLL_MS));
  }
}
launch();
</script>
</body>
</html>
