# Lint and format configuration only; the package builds through setup.py
# (ament_python). Tool versions are pinned in scripts/setup_dev_tools.sh.
# Settings track ament_flake8: 99 columns, single quotes.

[tool.black]
line-length = 99
skip-string-normalization = true
target-version = ['py312']
extend-exclude = '^/(scripts/dashboards|build|install|log)/'

[tool.ruff]
line-length = 99
target-version = 'py312'
extend-exclude = ['scripts/dashboards', 'build', 'install', 'log']

[tool.ruff.lint]
# Import order is left to ament_flake8 (google style).
select = ['E', 'F', 'W', 'B', 'C4', 'Q', 'UP']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.mypy]
python_version = '3.12'
files = ['racecar_neo_ros2_driver', 'launch', 'scripts']
exclude = ['^scripts/dashboards/']
# rclpy, message packages, pycoral and luma ship no type stubs.
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
